name: red-green-order

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  red-before-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Every green commit has an earlier red commit
        run: python harness/ci/red_green_check.py "${{ github.sha }}"
