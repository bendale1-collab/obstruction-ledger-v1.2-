name: seal-check

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  retrodiction-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Compare first code commit to gist revision timestamp
        id: seal
        env:
          GIST_REVISION_TIME: ${{ vars.GIST_REVISION_TIME }}
        run: |
          if [ -z "$GIST_REVISION_TIME" ]; then
            echo "no gist revision time configured; nothing to compare against"
            exit 0
          fi
          result=$(python harness/ci/seal_check.py \
            --gist-revision-time "$GIST_REVISION_TIME" \
            --base-ref "origin/${{ github.event.repository.default_branch }}" \
            --head-ref "${{ github.sha }}")
          echo "$result"
          label=$(echo "$result" | python -c "import json,sys; print(json.load(sys.stdin)['label'] or '')")
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Apply RETRODICTION label
        if: steps.seal.outputs.label == 'RETRODICTION' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label RETRODICTION
